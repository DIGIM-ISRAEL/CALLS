# Calls (reps) dial stack — local only. Nothing here may point at the Kill Gong server (46.101.212.74).
location = /process-donation { proxy_pass http://127.0.0.1:3002; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 120s; }
location /dialer/ { proxy_pass http://127.0.0.1:3003; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
location = /ingest-call { proxy_pass http://127.0.0.1:3002; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; client_max_body_size 160m; proxy_request_buffering off; proxy_read_timeout 300s; proxy_send_timeout 300s; }
location = /dial-started { proxy_pass http://127.0.0.1:3002; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
location = /app/current-dial { proxy_pass http://127.0.0.1:3002; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
location = /app/leads { proxy_pass http://127.0.0.1:3011/app-leads$is_args$args; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }
location = /app/institutions { proxy_pass http://127.0.0.1:3011/app-institutions$is_args$args; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }
location /recordings/ { alias /var/calls-dialer/recordings/; add_header Access-Control-Allow-Origin "*"; }

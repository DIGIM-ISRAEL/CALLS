# Maskyoo egress relay for the CALLS server (46.101.204.111) ONLY.
# Maskyoo/Cloudflare allowlists just this server's IP. CONNECT-only to app.maskyoo.co.il:443;
# TLS is end-to-end, so this relay never sees the API key or call data. Nothing else may use it.
User tinyproxy
Group tinyproxy
Port 8899
Listen 46.101.212.74
Timeout 120
MaxClients 30
LogLevel Connect
LogFile "/var/log/tinyproxy/tinyproxy.log"
PidFile "/run/tinyproxy/tinyproxy.pid"
Allow 46.101.204.111
ConnectPort 443
DisableViaHeader Yes
Filter "/etc/tinyproxy/maskyoo-only.filter"
FilterType ere
FilterDefaultDeny Yes
FilterURLs Off
